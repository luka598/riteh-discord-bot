[package]
name = "riteh-discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serenity = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
reqwest = "0.13.5"
dotenvy = "0.15.7"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
